<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover">
<title>REMNANT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}

canvas{display:block;width:100%;height:100%;}
#mc{position:absolute;bottom:40px;left:0;width:100%;display:none;justify-content:space-between;align-items:center;padding:0 30px;pointer-events:none;z-index:20;}
.jz{width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.14);position:relative;pointer-events:auto;flex-shrink:0;}
.jt{width:65px;height:65px;border-radius:50%;background:rgba(180,220,255,0.65);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 16px rgba(180,220,255,0.4);}
.ab{width:90px;height:90px;border-radius:50%;background:rgba(0,50,90,0.75);border:2px solid rgba(80,160,220,0.65);color:#adf;font-size:26px;font-weight:bold;pointer-events:auto;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
@media(max-width:768px),(pointer:coarse){#mc{display:flex;}}

</head>
<body>
<div id="gc">
  <canvas id="gameCanvas"></canvas>
  <div id="mc">
    <div class="jz" id="jz"><div class="jt" id="jt"></div></div>
    <button class="ab" id="ab">E</button>
  </div>
</div>
<script>
(function(){'use strict';

// ── CANVAS SETUP ─────────────────────────────────────────
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const cont=document.getElementById('gc');
const jzEl=document.getElementById('jz'),jtEl=document.getElementById('jt'),abEl=document.getElementById('ab');
const lm=document.createElement('canvas'),lctx=lm.getContext('2d');
function resizeCanvas(){canvas.width=cont.clientWidth||window.innerWidth;canvas.height=cont.clientHeight||window.innerHeight;lm.width=canvas.width;lm.height=canvas.height;}
resizeCanvas();

// ── CONSTANTS ─────────────────────────────────────────────
const TS=48;
const FLOOR=0,WALL=1,DOOR_U=2,DOOR_L=3,DOOR_X=4,HIDE=5;

// ── GAME STATE ────────────────────────────────────────────
let gs='menu'; // menu|locSelect|diffSelect|monsterSelect|playing|paused|death|win

// Choices
let locId='station'; // station|mansion|bunker
let gameDiff='medium'; // easy|medium|hard
let monDiff='medium';  // practice|easy|medium|nightmare

// Map dims (set per difficulty)
let MC=36,MR=28,WW=MC*TS,WH=MR*TS;

// Gameplay params (set per difficulty + monster)
let trapCount=4,itemsNeeded=3;
let phpMax=3,php=3,pspd=155,lr=230;
let ebs=135,ehr=350,ecount=1;

// Runtime
let gt=0,sfl=0,shk=0;

// Sanity
let sanity=100,hallGhost=null,hallMoveTimer=0;
let flickTimer=0,flickActive=false;

// Objectives
let objPowerCell=false,objCoresNeeded=0,objCoresFound=0;
function canExit(){return objPowerCell&&objCoresFound>=objCoresNeeded;}

// Note popup
let notePopup=null; // {text, timer}

// ── LOCATION CONFIGS ──────────────────────────────────────
const LOC={
  station:{
    name:'RESEARCH STATION',sub:'"Black Forest" — 1994',
    desc:'A classified acoustic lab. The science team vanished 6 days ago.',
    wR:42,wG:46,wB:52, fR:24,fG:27,fB:33,
    accent:'#00bbff',monsterAura:'rgba(70,0,110,',
    itemName:'Signal Core',powerName:'Power Cell',
    exitLabel:'SIGNAL LOCK',
    notes:[
      '"Experiment log 47: The Remnant tracks cortisol at 18Hz. Fear itself is a beacon. Stay calm." — Dr. Chen',
      '"Power Cell is in Lab B, lower section. Exit mechanism needs it. Harlan locked it there." — Security log',
      '"Day 3. Jenkins ran. Made noise near equipment storage. We found what was left in corridor 4."',
      '"It does not sleep. It does not stop. The jammer failed on day 2." — Dr. Harlan Voss, final entry',
      '"I split the exit key into three Signal Cores. Find them all. Use them at the main door. Get out."'
    ]
  },
  mansion:{
    name:'BLACKWOOD MANOR',sub:'Yorkshire — 1887',
    desc:'A Victorian estate sealed after the Blackwood family vanished without explanation.',
    wR:34,wG:21,wB:14, fR:22,fG:14,fB:9,
    accent:'#dd9933',monsterAura:'rgba(70,35,0,',
    itemName:'Phylactery Shard',powerName:'The Heart',
    exitLabel:'SEALED',
    notes:[
      '"The creature is not Aldric anymore. Whatever the ritual summoned used his body as a vessel." — Constance',
      '"I broke the phylactery into shards. Scattered them through the house. God forgive me." — Father Brennan',
      '"It feeds on fear. The longer you watch it, the stronger it becomes. Do NOT look at it directly."',
      '"The old heart — the energy source — is in the cellar. The wards on the front door need it." — Occult notes',
      '"Stay in shadow. Move quietly. It hunts by sound and the resonance of a terrified mind."'
    ]
  },
  bunker:{
    name:'BUNKER ZETA-7',sub:'USSR — 1962',
    desc:'A Cold War underground facility. Decommissioned. Or so they said.',
    wR:33,wG:38,wB:29, fR:20,fG:24,fB:18,
    accent:'#cc3333',monsterAura:'rgba(100,0,0,',
    itemName:'Access Chip',powerName:'Reactor Key',
    exitLabel:'BLAST DOOR',
    notes:[
      '"Subject 7 escaped containment at 03:14. All personnel advised to evacuate. Do not engage."',
      '"Reactor Key is in Section D. Exit blast doors require reactor power to open." — Facility manual',
      '"Three access chips lost in the evacuation. You need all of them for the door override." — Director',
      '"It remembers the layout. It knows every corridor. Your only advantage is unpredictability." — Dr. Volkov',
      '"If you\'re reading this, you\'re already inside. I\'m sorry."'
    ]
  }
};

// ── AUDIO ─────────────────────────────────────────────────
let ac=null;
function initAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function beep(f,d,v=0.07,t='square'){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function nz(d,v=0.04){if(!ac)return;try{const b=ac.createBuffer(1,Math.floor(ac.sampleRate*d),ac.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/dt.length,2);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);s.connect(g);g.connect(ac.destination);s.start();}catch(e){}}
const sfx={
  foot:()=>{nz(0.1,0.02);beep(38+Math.random()*25,0.05,0.012,'triangle');},
  door:()=>{beep(22,0.28,0.055,'sawtooth');nz(0.13,0.032);},
  collect:()=>{beep(480,0.08,0.06);beep(720,0.14,0.055);},
  power:()=>{nz(0.35,0.1);beep(55,0.4,0.09,'sawtooth');beep(110,0.25,0.06,'square');},
  dmg:()=>{beep(28,0.42,0.11,'sawtooth');nz(0.3,0.09);},
  health:()=>{beep(280,0.09,0.06,'sine');beep(460,0.13,0.055,'sine');},
  trap:()=>{nz(0.45,0.14);beep(58,0.32,0.1,'sawtooth');},
  note:()=>{beep(175,0.28,0.04,'sine');},
  win:()=>{beep(380,0.14,0.08);setTimeout(()=>beep(560,0.14,0.08),160);setTimeout(()=>beep(750,0.3,0.1),320);},
};

// ── MAP GENERATION ────────────────────────────────────────
let map=[],doors={},decos=[];

function genMap(){
  const m=[];
  for(let r=0;r<MR;r++){m[r]=[];for(let c=0;c<MC;c++)m[r][c]=(r===0||r===MR-1||c===0||c===MC-1)?WALL:FLOOR;}
  const sp=7; // room spacing
  // Vertical dividers
  for(let wc=sp;wc<MC-1;wc+=sp){for(let r=1;r<MR-1;r++)m[r][wc]=WALL;}
  // Horizontal dividers
  for(let wr=sp;wr<MR-1;wr+=sp){for(let c=1;c<MC-1;c++)m[wr][c]=WALL;}
  // Punch doors through vertical walls
  for(let wc=sp;wc<MC-1;wc+=sp){
    for(let seg=0;seg<Math.ceil(MR/sp);seg++){
      const r1=seg*sp+1,r2=Math.min((seg+1)*sp-1,MR-2);
      for(let d=0;d<2;d++){const r=r1+Math.floor(Math.random()*(r2-r1+1));if(r>=1&&r<=MR-2&&m[r]&&m[r][wc]===WALL)m[r][wc]=Math.random()<0.3?DOOR_L:DOOR_U;}
    }
  }
  // Punch doors through horizontal walls
  for(let wr=sp;wr<MR-1;wr+=sp){
    for(let seg=0;seg<Math.ceil(MC/sp);seg++){
      const c1=seg*sp+1,c2=Math.min((seg+1)*sp-1,MC-2);
      for(let d=0;d<2;d++){const c=c1+Math.floor(Math.random()*(c2-c1+1));if(c>=1&&c<=MC-2&&m[wr]&&m[wr][c]===WALL)m[wr][c]=Math.random()<0.3?DOOR_L:DOOR_U;}
    }
  }
  // Random obstacle walls
  const obs=Math.floor(MC*MR/90);
  for(let i=0;i<obs;i++){
    const r=2+Math.floor(Math.random()*(MR-4)),c=2+Math.floor(Math.random()*(MC-4));
    if(m[r]&&m[r][c]===FLOOR){const len=2+Math.floor(Math.random()*3),hz=Math.random()<0.5;for(let j=0;j<len;j++){const nr=hz?r:r+j,nc=hz?c+j:c;if(nr>0&&nr<MR-1&&nc>0&&nc<MC-1&&m[nr]&&m[nr][nc]===FLOOR)m[nr][nc]=WALL;}}
  }
  return m;
}

function initDoors(){
  doors={};
  for(let r=0;r<MR;r++)for(let c=0;c<MC;c++){
    const t=map[r][c];
    if(t===DOOR_U)doors[`${r},${c}`]={locked:false,closed:true};
    else if(t===DOOR_L)doors[`${r},${c}`]={locked:true,closed:true,kid:Math.floor(Math.random()*2)};
    else if(t===DOOR_X)doors[`${r},${c}`]={locked:false,closed:true,isExit:true};
  }
}
function getDS(r,c){return doors[`${r},${c}`]||null;}
function passable(r,c,fe=false){
  if(r<0||r>=MR||c<0||c>=MC)return false;
  const t=map[r]?.[c];if(t===undefined||t===WALL)return false;
  if(t===FLOOR||t===HIDE)return true;
  if(fe)return true; // enemies pass through all doors
  const d=getDS(r,c);if(!d)return false;
  return !d.closed;
}
function isDoor(r,c){const t=map[r]?.[c];return t===DOOR_U||t===DOOR_L||t===DOOR_X;}
function nearDoor(r,c,dist=2){for(let dr=-dist;dr<=dist;dr++)for(let dc=-dist;dc<=dist;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<MR&&nc>=0&&nc<MC&&isDoor(nr,nc))return true;}return false;}
function validSpawn(r,c){
  if((map[r]?.[c])!==FLOOR)return false;
  if(r<2||r>MR-3||c<2||c>MC-3)return false;
  if(nearDoor(r,c,2))return false;
  return[[-1,0],[1,0],[0,-1],[0,1]].some(([dr,dc])=>passable(r+dr,c+dc,false));
}
function getSpawn(excl=[]){
  for(let i=0;i<400;i++){const r=2+Math.floor(Math.random()*(MR-4)),c=2+Math.floor(Math.random()*(MC-4));if(validSpawn(r,c)&&excl.every(e=>Math.hypot(e.c-c,e.r-r)>=4))return{r,c};}
  for(let r=2;r<MR-2;r++)for(let c=2;c<MC-2;c++)if(validSpawn(r,c)&&excl.every(e=>Math.hypot(e.c-c,e.r-r)>=4))return{r,c};
  return{r:3,c:3};
}
function initDecos(){
  decos=[];
  for(let i=0;i<Math.floor(MC*MR/55);i++){
    for(let a=0;a<80;a++){const r=1+Math.floor(Math.random()*(MR-2)),c=1+Math.floor(Math.random()*(MC-2));if(map[r]?.[c]===FLOOR){decos.push({r,c,rot:Math.random()*Math.PI*2,sc:0.3+Math.random()*0.7,v:Math.floor(Math.random()*4)});break;}}
  }
}

// ── PARTICLES ─────────────────────────────────────────────
let parts=[];
function spawnP(x,y,type,n=5){if(parts.length>80){parts.splice(0,n);}
  const cfg={blood:{col:'rgba(160,0,0,0.85)',sz:3,g:55},dust:{col:'rgba(130,100,60,0.4)',sz:2,g:0},spark:{col:'rgba(255,200,60,0.9)',sz:2,g:-10}};
  const c=cfg[type]||cfg.spark;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=30+Math.random()*80,life=0.35+Math.random()*0.45;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,ml:life,col:c.col,sz:c.sz+Math.random()*c.sz,g:c.g});}
}
function updP(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.93;p.life-=dt;if(p.life<=0)parts.splice(i,1);}}

// ── ITEMS & HIDES ─────────────────────────────────────────
let pickups=[],hides=[],noiseTraps=[],notes=[];

function initPickups(){
  pickups=[];hides=[];noiseTraps=[];notes=[];
  const usedSpots=[];

  // Place hiding spots
  const hideCount=Math.max(6,Math.floor(MC*MR/130));
  for(let i=0;i<hideCount;i++){const p=getSpawn(usedSpots);if(map[p.r]?.[p.c]===FLOOR){map[p.r][p.c]=HIDE;hides.push({r:p.r,c:p.c});usedSpots.push(p);}}

  // Power source (1, always, makes noise when collected)
  const pp=getSpawn(usedSpots);
  pickups.push({type:'power',wx:pp.c*TS+TS/2,wy:pp.r*TS+TS/2,got:false});
  usedSpots.push(pp);

  // Cores (objCoresNeeded)
  for(let i=0;i<objCoresNeeded;i++){const p=getSpawn(usedSpots);pickups.push({type:'core',idx:i,wx:p.c*TS+TS/2,wy:p.r*TS+TS/2,got:false});usedSpots.push(p);}

  // Health packs (3)
  for(let i=0;i<3;i++){const p=getSpawn(usedSpots);pickups.push({type:'hp',wx:p.c*TS+TS/2,wy:p.r*TS+TS/2,got:false});usedSpots.push(p);}

  // Notes (up to 5)
  const noteTexts=LOC[locId].notes;
  for(let i=0;i<Math.min(5,noteTexts.length);i++){const p=getSpawn(usedSpots);notes.push({wx:p.c*TS+TS/2,wy:p.r*TS+TS/2,got:false,text:noteTexts[i]});usedSpots.push(p);}

  // Noise traps
  for(let i=0;i<trapCount;i++){const p=getSpawn(usedSpots);if(p){noiseTraps.push({r:p.r,c:p.c,wx:p.c*TS+TS/2,wy:p.r*TS+TS/2,triggered:false,cd:0,type:['shelf','glass','radio'][i%3]});usedSpots.push(p);}}

  // Exit door
  const eR=MR-3,eC=MC-3;
  if(map[eR]?.[eC]!==undefined){map[eR][eC]=DOOR_X;doors[`${eR},${eC}`]={locked:false,closed:true,isExit:true};}
}

function updTraps(dt){
  for(const tr of noiseTraps){
    if(tr.triggered){tr.cd-=dt;if(tr.cd<=0)tr.triggered=false;continue;}
    if(Math.hypot(player.x-tr.wx,player.y-tr.wy)<TS*1.4){
      tr.triggered=true;tr.cd=10;
      noiseLv=Math.min(100,noiseLv+75);sfx.trap();spawnP(tr.wx,tr.wy,'spark',8);
      for(const e of enemies){e.lkx=tr.wx;e.lky=tr.wy;if(e.state!=='chase'){e.state='investigate';e.stimer=4.5;recalcPath(e,tr.r,tr.c);}}
    }
  }
}

// ── PLAYER ───────────────────────────────────────────────
let stam=100,maxStam=100,noiseLv=0;
let player={x:0,y:0,vx:0,vy:0,rad:14,hiding:false,hideRef:null,lastStep:0,dmgCD:0,iTimer:0,angle:Math.PI/2,running:false};

function resetPlayer(){
  const p=getSpawn();
  player.x=p.c*TS+TS/2;player.y=p.r*TS+TS/2;
  player.vx=0;player.vy=0;player.hiding=false;player.hideRef=null;
  player.lastStep=performance.now()/1000;player.dmgCD=0;player.iTimer=1.5;player.angle=Math.PI/2;player.running=false;
  stam=maxStam;noiseLv=0;
}
function pGrid(){return{r:Math.floor(player.y/TS),c:Math.floor(player.x/TS)};}
function nearHide(){
  const g=pGrid();
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const r=g.r+dr,c=g.c+dc;if(r>=0&&r<MR&&c>=0&&c<MC&&map[r]?.[c]===HIDE){const hx=c*TS+TS/2,hy=r*TS+TS/2;if(Math.hypot(player.x-hx,player.y-hy)<TS*1.2)return{r,c};}}
  return null;
}
function updPlayer(dt){
  if(gs!=='playing'||player.hiding){player.vx=0;player.vy=0;return;}
  if(player.dmgCD>0)player.dmgCD-=dt;
  if(player.iTimer>0)player.iTimer-=dt;
  let ix=0,iy=0,wantRun=false;
  if(jActive){ix=jVec.x;iy=jVec.y;wantRun=Math.hypot(ix,iy)>0.7;}
  if(keys['w']||keys['arrowup'])iy=-1;if(keys['s']||keys['arrowdown'])iy=1;
  if(keys['a']||keys['arrowleft'])ix=-1;if(keys['d']||keys['arrowright'])ix=1;
  if(keys['shift'])wantRun=true;
  const mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag;}
  if(mag>0.1)player.angle=Math.atan2(iy,ix);
  const canRun=stam>5,running=wantRun&&mag>0.3&&canRun;
  stam=running?Math.max(0,stam-38*dt):Math.min(maxStam,stam+(mag<0.1?22:14)*dt);
  player.running=running;
  if(mag>0.1){const tn=running?78:18;noiseLv+=(tn-noiseLv)*dt*3;}else noiseLv=Math.max(0,noiseLv-42*dt);
  noiseLv=Math.max(0,Math.min(100,noiseLv));
  const spd=running?pspd*1.52:pspd;
  player.vx=ix*spd;player.vy=iy*spd;
  const cc=(px,py)=>{const gr=Math.floor(py/TS),gc=Math.floor(px/TS);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=gr+dr,c=gc+dc;if(r>=0&&r<MR&&c>=0&&c<MC&&!passable(r,c,false)){const tx=c*TS,ty=r*TS,cx2=Math.max(tx,Math.min(px,tx+TS)),cy2=Math.max(ty,Math.min(py,ty+TS));if(Math.hypot(px-cx2,py-cy2)<player.rad)return true;}}return false;};
  const nx=player.x+player.vx*dt,ny=player.y+player.vy*dt;
  if(!cc(nx,player.y))player.x=nx;if(!cc(player.x,ny))player.y=ny;
  player.x=Math.max(player.rad,Math.min(WW-player.rad,player.x));
  player.y=Math.max(player.rad,Math.min(WH-player.rad,player.y));
  if(Math.abs(player.vx)>10||Math.abs(player.vy)>10){
    const now=performance.now()/1000,iv=running?0.2:0.38;
    if(now-player.lastStep>iv){
      player.lastStep=now;sfx.foot();if(running)spawnP(player.x,player.y,'dust',2);
      const hr=ehr*(noiseLv/100);
      for(const e of enemies)if(e.hcool<=0&&Math.hypot(e.x-player.x,e.y-player.y)<hr){e.lkx=player.x;e.lky=player.y;if(e.state==='patrol'||e.state==='idle'){e.state='investigate';e.stimer=3.5;recalcPath(e,Math.floor(e.lky/TS),Math.floor(e.lkx/TS));}e.hcool=2.0;}
    }
  }
}

// ── ENEMY AI ──────────────────────────────────────────────
let enemies=[];
function buildGrid(fe){const g=[];for(let r=0;r<MR;r++){g[r]=[];for(let c=0;c<MC;c++)g[r][c]=passable(r,c,fe);}return g;}
function bfs(sr,sc,tr,tc,g){
  if(sr===tr&&sc===tc)return[{r:sr,c:sc}];
  if(!g[sr]?.[sc]||!g[tr]?.[tc])return null;
  const q=[{r:sr,c:sc}],vis=new Set(),par={},K=(r,c)=>`${r},${c}`;
  vis.add(K(sr,sc));
  const D=[[-1,0],[1,0],[0,-1],[0,1]];
  while(q.length){
    const cur=q.shift();
    if(cur.r===tr&&cur.c===tc){const p=[];let n=cur;while(n){p.unshift({r:n.r,c:n.c});n=par[K(n.r,n.c)];}return p;}
    for(const[dr,dc]of D){const nr=cur.r+dr,nc=cur.c+dc,nk=K(nr,nc);if(nr>=0&&nr<MR&&nc>=0&&nc<MC&&g[nr]?.[nc]&&!vis.has(nk)){vis.add(nk);par[nk]=cur;q.push({r:nr,c:nc});}}
  }return null;
}
function clamp(r,c){return{r:Math.max(0,Math.min(MR-1,r)),c:Math.max(0,Math.min(MC-1,c))};}
function eGrid(e){return{r:Math.round((e.y-TS/2)/TS),c:Math.round((e.x-TS/2)/TS)};}
function recalcPath(e,tr,tc){const s=clamp(eGrid(e).r,eGrid(e).c),t=clamp(tr,tc),path=bfs(s.r,s.c,t.r,t.c,buildGrid(true));e.path=path?(path.length>1?path.slice(1):[]):[];}
function mkEnemy(id){
  const p=getSpawn([pGrid()]);
  const e={x:p.c*TS+TS/2,y:p.r*TS+TS/2,rad:10,spd:ebs,state:'patrol',wp:[],wi:0,tx:0,ty:0,lkx:0,lky:0,stimer:0,itimer:0,stimer2:0,path:[],prt:0,hcool:0,visible:false,dist:999,eyeP:Math.random()*Math.PI*2,id};
  for(let i=0;i<8;i++){const q=getSpawn();e.wp.push({x:q.c*TS+TS/2,y:q.r*TS+TS/2});}
  if(e.wp.length){e.tx=e.wp[0].x;e.ty=e.wp[0].y;}
  return e;
}
function updEnemy(e,dt){
  if(gs!=='playing')return;
  if(player.hiding&&e.state==='chase'){e.state='search';e.stimer=5.5;e.lkx=player.x;e.lky=player.y;e.stimer2=0;}
  e.hcool=Math.max(0,e.hcool-dt);
  e.dist=Math.hypot(e.x-player.x,e.y-player.y);
  e.eyeP+=dt*2.2;
  const vr=monDiff==='nightmare'?lr*0.8:lr;
  e.visible=e.dist<vr&&!player.hiding;
  if(e.visible&&e.state!=='chase'){e.state='chase';e.stimer=0;}
  if(e.state==='chase'&&!e.visible&&e.stimer>3){e.state='search';e.stimer=6;e.lkx=player.x;e.lky=player.y;e.stimer2=0;}
  if(e.state==='investigate'&&e.stimer<=0){e.state='search';e.stimer=4;e.stimer2=0;}
  if(e.state==='search'&&e.stimer<=0){e.state='patrol';e.path=[];}
  if(e.state==='idle'&&e.itimer<=0)e.state='patrol';
  e.stimer-=dt;if(e.state==='idle')e.itimer-=dt;
  let tr,tc;
  if(e.state==='patrol'){
    if(!e.wp.length)return;const wp=e.wp[e.wi];e.tx=wp.x;e.ty=wp.y;tr=Math.floor(wp.y/TS);tc=Math.floor(wp.x/TS);
    if(Math.hypot(e.x-wp.x,e.y-wp.y)<TS*0.5){e.wi=(e.wi+1)%e.wp.length;if(Math.random()<0.3){e.state='idle';e.itimer=1.5+Math.random()*2;}}
  }else if(e.state==='chase'){e.tx=player.x;e.ty=player.y;tr=Math.floor(player.y/TS);tc=Math.floor(player.x/TS);e.lkx=player.x;e.lky=player.y;}
  else{e.tx=e.lkx;e.ty=e.lky;tr=Math.floor(e.lky/TS);tc=Math.floor(e.lkx/TS);
    if(e.state==='search'){e.stimer2+=dt;if(e.stimer2>2&&e.dist>vr){const nh=[];for(let r=0;r<MR;r++)for(let c=0;c<MC;c++)if(map[r]?.[c]===HIDE){const d=Math.hypot(e.lkx-(c*TS+TS/2),e.lky-(r*TS+TS/2));if(d<TS*7)nh.push({r,c,d});}nh.sort((a,b)=>a.d-b.d);if(nh.length>0){const h=nh[Math.floor(e.stimer2/3)%nh.length];tr=h.r;tc=h.c;e.tx=h.c*TS+TS/2;e.ty=h.r*TS+TS/2;if(player.hiding&&player.hideRef&&player.hideRef.r===h.r&&player.hideRef.c===h.c&&Math.random()<0.32){player.hiding=false;player.hideRef=null;dmgPlayer(1);e.state='chase';}}}}
  }
  e.prt-=dt;if(e.prt<=0||!e.path.length){e.prt=0.5;const ct=clamp(tr,tc);recalcPath(e,ct.r,ct.c);}
  let ms=e.spd;if(e.state==='chase')ms*=1.42;else if(e.state==='patrol')ms*=0.52;else if(e.state==='idle')ms=0;
  if(e.path.length&&ms>0){const nx=e.path[0],wx=nx.c*TS+TS/2,wy=nx.r*TS+TS/2,ddx=wx-e.x,ddy=wy-e.y,dst=Math.hypot(ddx,ddy);if(dst<4)e.path.shift();else{e.x+=(ddx/dst)*ms*dt;e.y+=(ddy/dst)*ms*dt;}}
  e.x=Math.max(e.rad,Math.min(WW-e.rad,e.x));e.y=Math.max(e.rad,Math.min(WH-e.rad,e.y));
  if(e.dist<player.rad+18&&!player.hiding&&player.iTimer<=0)dmgPlayer(1);
  if(e.state==='chase')e.spd=Math.min(ebs*1.6,e.spd+dt*4);else e.spd=Math.max(ebs,e.spd-dt*5);
}

// ── SANITY ────────────────────────────────────────────────
function updSanity(dt){
  if(gs!=='playing')return;
  let change=0;
  let anyVisible=false;
  for(const e of enemies){
    if(e.visible&&!player.hiding){
      // Only lose sanity when you can actually SEE the monster
      change-=18*dt;
      anyVisible=true;
    }
  }
  // Recover sanity when hiding OR when monster is not visible
  if(player.hiding) change+=10*dt;
  else if(!anyVisible) change+=4*dt; // slowly recover when monster not in sight
  sanity=Math.max(0,Math.min(100,sanity+change));
  // Hallucination
  hallMoveTimer-=dt;
  if(sanity<25){
    if(!hallGhost){const p=getSpawn();hallGhost={x:p.c*TS+TS/2,y:p.r*TS+TS/2,angle:Math.random()*Math.PI*2,eyeP:0};}
    if(hallMoveTimer<=0){hallMoveTimer=0.8+Math.random()*1.2;hallGhost.angle+=( Math.random()-0.5)*1.2;}
    hallGhost.x+=Math.cos(hallGhost.angle)*35*dt;hallGhost.y+=Math.sin(hallGhost.angle)*35*dt;
    hallGhost.x=Math.max(TS,Math.min(WW-TS,hallGhost.x));hallGhost.y=Math.max(TS,Math.min(WH-TS,hallGhost.y));
    hallGhost.eyeP+=dt*3;
    // Random phantom sound
    if(Math.random()<0.004)sfx.foot();
  }else hallGhost=null;
  // Flicker
  flickTimer-=dt;
  if(flickTimer<=0&&sanity<45){flickTimer=2.5+Math.random()*4;if(Math.random()<(1-sanity/45)){flickActive=true;setTimeout(()=>{flickActive=false;},60+Math.random()*100);}}
}

function interact(){
  if(gs!=='playing')return;
  const g=pGrid();
  // Hiding
  const hi=nearHide();
  if(hi&&!player.hiding){player.hiding=true;player.hideRef=hi;player.vx=0;player.vy=0;beep(20,0.2,0.03,'sine');return;}
  if(player.hiding){player.hiding=false;player.hideRef=null;beep(28,0.14,0.03,'sine');return;}
  // Doors
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
    const r=g.r+dr,c=g.c+dc;if(r<0||r>=MR||c<0||c>=MC)continue;
    const t=map[r]?.[c];if(t===DOOR_U||t===DOOR_L||t===DOOR_X){
      const d=getDS(r,c);if(!d)continue;
      const ddx=c*TS+TS/2,ddy=r*TS+TS/2;
      if(Math.hypot(player.x-ddx,player.y-ddy)<TS*1.55){
        if(!d.closed&&!d.locked&&Math.hypot(player.x-ddx,player.y-ddy)<TS/2+player.rad)return;
        if(d.isExit){
          if(canExit()){gs='win';sfx.win();}
          else{
            const missing=[];if(!objPowerCell)missing.push(LOC[locId].powerName);if(objCoresFound<objCoresNeeded)missing.push(`${LOC[locId].itemName}: ${objCoresFound}/${objCoresNeeded}`);
            notePopup={text:'LOCKED — Need: '+missing.join(', '),timer:3};beep(80,0.25,0.06,'square');
          }return;
        }
        if(d.locked){beep(80,0.2,0.06,'square');}
        else{d.closed=!d.closed;sfx.door();noiseLv=Math.min(100,noiseLv+38);}
        return;
      }
    }
  }
  // Notes
  for(const nt of notes){if(nt.got)continue;if(Math.hypot(player.x-nt.wx,player.y-nt.wy)<TS*1.3){nt.got=true;notePopup={text:nt.text,timer:5.5};sfx.note();sanity=Math.min(100,sanity+9);return;}}
  // Pickups
  for(const it of pickups){
    if(it.got)continue;
    if(Math.hypot(player.x-it.wx,player.y-it.wy)<TS*1.25){
      it.got=true;
      if(it.type==='power'){objPowerCell=true;sfx.power();spawnP(it.wx,it.wy,'spark',12);noiseLv=Math.min(100,noiseLv+65);for(const e of enemies){if(e.state!=='chase'){e.state='investigate';e.lkx=player.x;e.lky=player.y;e.stimer=5;recalcPath(e,Math.floor(player.y/TS),Math.floor(player.x/TS));}}}
      else if(it.type==='core'){objCoresFound++;sfx.collect();spawnP(it.wx,it.wy,'spark',8);sanity=Math.min(100,sanity+6);}
      else if(it.type==='hp'){if(php<phpMax){php++;sfx.health();spawnP(it.wx,it.wy,'spark',5);}else it.got=false;}
      return;
    }
  }
}

function dmgPlayer(n){
  if(player.iTimer>0)return;
  php-=n;player.dmgCD=0.8;player.iTimer=1.5;sfl=1;sfx.dmg();
  spawnP(player.x,player.y,'blood',10);shk=6;
  if(php<=0){php=0;gs='death';beep(25,1.1,0.14,'sawtooth');}
}

function inBtn(mx,my,b){return mx>b.x-b.w/2&&mx<b.x+b.w/2&&my>b.y-b.h/2&&my<b.y+b.h/2;}
function menuClick(e){
  if(gs==='playing')return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width),my=(e.clientY-rect.top)*(canvas.height/rect.height);
  for(const b of getBtns()){
    if(!inBtn(mx,my,b))continue;
    if(gs==='menu'){gs='locSelect';return;}
    if(gs==='locSelect'){locId=b.id;gs='diffSelect';return;}
    if(gs==='diffSelect'){
      gameDiff=b.id;
      if(b.id==='easy'){MC=36;MR=28;trapCount=2;objCoresNeeded=1;}
      else if(b.id==='medium'){MC=46;MR=36;trapCount=4;objCoresNeeded=2;}
      else{MC=56;MR=42;trapCount=7;objCoresNeeded=3;}
      WW=MC*TS;WH=MR*TS;gs='monsterSelect';return;
    }
    if(gs==='monsterSelect'){
      monDiff=b.id;
      if(b.id==='practice'){lr=9999;ecount=0;ebs=0;ehr=0;}
      else if(b.id==='easy'){lr=9999;ecount=1;ebs=65;ehr=180;}
      else if(b.id==='medium'){lr=235;ecount=1;ebs=135;ehr=355;}
      else{lr=148;ecount=2;ebs=188;ehr=475;}
      startGame();return;
    }
    if(gs==='paused'){if(b.t==='RESUME')gs='playing';else gs='menu';return;}
    if(gs==='death'||gs==='win'){gs='menu';return;}
  }
}

function startGame(){
  phpMax=3;php=phpMax;
  map=genMap();initDoors();initPickups();initDecos();
  resetPlayer();enemies=[];for(let i=0;i<ecount;i++)enemies.push(mkEnemy(i));
  objPowerCell=false;objCoresFound=0;gt=0;sfl=0;shk=0;sanity=100;hallGhost=null;notePopup=null;
  gs='playing';initAudio();
}

// ── UPDATE ────────────────────────────────────────────────
function update(dt){
  if(gs!=='playing')return;
  dt=Math.min(dt,0.2);gt+=dt;
  updPlayer(dt);for(const e of enemies)updEnemy(e,dt);
  updSanity(dt);updTraps(dt);updP(dt);
  if(sfl>0)sfl=Math.max(0,sfl-dt*4);
  if(shk>0)shk=Math.max(0,shk*0.82-0.1);
  if(notePopup){notePopup.timer-=dt;if(notePopup.timer<=0)notePopup=null;}
}

let camX=0,camY=0;
function updCam(){
  const tx=Math.max(0,Math.min(WW-canvas.width,player.x-canvas.width/2));
  const ty=Math.max(0,Math.min(WH-canvas.height,player.y-canvas.height/2));

// ── DRAW FUNCTIONS ────────────────────────────────────────
function drawWall(sx,sy,r,c){
  const L=LOC[locId];const v=((r*13+c*7)%5)*3;
  ctx.fillStyle=`rgb(${L.wR+v},${L.wG+v},${L.wB+v})`;ctx.fillRect(sx,sy,TS,TS);
  ctx.save();ctx.beginPath();ctx.rect(sx,sy,TS,TS);ctx.clip();
  if(locId==='mansion'){
    // Stone bricks
    ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;const bH=12;
    for(let my=0;my<=TS;my+=bH){ctx.beginPath();ctx.moveTo(sx,sy+my);ctx.lineTo(sx+TS,sy+my);ctx.stroke();}
    for(let my=0;my<TS;my+=bH){const rn=Math.floor((sy+my)/bH),off=(rn%2)*Math.round(TS/2);for(let mx=off-TS;mx<=TS;mx+=TS){ctx.beginPath();ctx.moveTo(sx+mx,sy+my);ctx.lineTo(sx+mx,sy+my+bH);ctx.stroke();}}
  }else if(locId==='station'){
    // Concrete panels
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;
    ctx.strokeRect(sx+2,sy+2,TS-4,TS-4);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.beginPath();ctx.moveTo(sx,sy+TS/2);ctx.lineTo(sx+TS,sy+TS/2);ctx.stroke();
    // Random crack
    if(((r*11+c*17)%7)===0){ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx+8,sy+10);ctx.lineTo(sx+18,sy+22);ctx.lineTo(sx+14,sy+35);ctx.stroke();}
  }else{
    // Bunker - painted concrete
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
    ctx.strokeRect(sx+1,sy+1,TS-2,TS-2);
    ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(sx,sy,TS,3);
    // Warning stripe
    if(((r*7+c*5)%9)===0){ctx.fillStyle='rgba(180,130,0,0.15)';ctx.fillRect(sx,sy+TS-6,TS,6);}
  }
  ctx.fillStyle='rgba(255,255,255,0.035)';ctx.fillRect(sx,sy,TS,2);
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(sx,sy+TS-3,TS,3);
  ctx.restore();
}
function drawFloor(sx,sy,r,c){
  const L=LOC[locId];const v=((r*7+c*11)%4)*2;
  ctx.fillStyle=`rgb(${L.fR+v},${L.fG+v},${L.fB+v})`;ctx.fillRect(sx,sy,TS,TS);
  ctx.save();ctx.beginPath();ctx.rect(sx,sy,TS,TS);ctx.clip();
  if(locId==='mansion'){
    // Wood planks
    ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1;
    for(let ly=9;ly<TS;ly+=9){ctx.beginPath();ctx.moveTo(sx,sy+ly);ctx.lineTo(sx+TS,sy+ly);ctx.stroke();}
  }else if(locId==='station'){
    // Tile grid
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
    ctx.strokeRect(sx,sy,TS/2,TS/2);ctx.strokeRect(sx+TS/2,sy+TS/2,TS/2,TS/2);
  }else{
    // Concrete with painted lines
    if(r%7===0){ctx.fillStyle='rgba(180,130,0,0.12)';ctx.fillRect(sx,sy,TS,4);}
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;ctx.strokeRect(sx+1,sy+1,TS-2,TS-2);
  }
  const sd=(r*37+c*19)%100;if(sd<22){ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(sx+sd%TS,sy+(sd*3)%TS,8+sd%10,1);}

}
function drawHide(sx,sy){

function drawDoor(sx,sy,r,c,d){
  if(!d||!d.closed){drawFloor(sx,sy,r,c);ctx.strokeStyle='rgba(80,50,20,0.65)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+2,sy);ctx.lineTo(sx+2,sy+TS);ctx.stroke();ctx.beginPath();ctx.moveTo(sx+TS-2,sy);ctx.lineTo(sx+TS-2,sy+TS);ctx.stroke();return;}
  const isExit=d.isExit,locked=d.locked;
  ctx.fillStyle=isExit?'#180000':(locked?'#201008':'#2e1a0a');ctx.fillRect(sx+3,sy+1,TS-6,TS-2);
  ctx.strokeStyle=isExit?'#660000':(locked?'#5a2010':'#6a3818');ctx.lineWidth=2;ctx.strokeRect(sx+3,sy+1,TS-6,TS-2);
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.strokeRect(sx+8,sy+5,TS-16,TS/2-5);ctx.strokeRect(sx+8,sy+TS/2+2,TS-16,TS/2-8);
  if(isExit){
    ctx.fillStyle=canExit()?'#00ff44':'#ff2200';ctx.shadowColor=canExit()?'#00ff44':'#ff2200';ctx.shadowBlur=9;
    ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    const L=LOC[locId];ctx.fillStyle=canExit()?'#44ff88':'#ff4444';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(L.exitLabel,sx+TS/2,sy+TS/2-9);
  }else if(locked){ctx.fillStyle='#ff3300';ctx.shadowColor='#ff3300';ctx.shadowBlur=7;ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
  else{ctx.fillStyle='rgba(160,110,50,0.75)';ctx.fillRect(sx+TS-11,sy+TS/2-4,4,8);}
}
function drawDeco(sx,sy,dc){

function applyFlashlight(){
  if(monDiff==='practice'||monDiff==='easy')return;
  const p=ws(player.x,player.y);
  lctx.clearRect(0,0,lm.width,lm.height);
  const dk=monDiff==='medium'?0.9:0.96;
  lctx.fillStyle=`rgba(0,0,0,${dk})`;lctx.fillRect(0,0,lm.width,lm.height);
  if(player.hiding){ctx.drawImage(lm,0,0);return;}
  lctx.globalCompositeOperation='destination-out';
  const a=player.angle,ca=Math.PI/2.7,cl=lr;
  const cg=lctx.createRadialGradient(p.x,p.y,0,p.x,p.y,cl);
  cg.addColorStop(0,'rgba(255,215,140,1)');cg.addColorStop(0.45,'rgba(255,200,100,0.92)');
  cg.addColorStop(0.85,'rgba(255,180,80,0.35)');cg.addColorStop(1,'rgba(0,0,0,0)');
  lctx.beginPath();lctx.moveTo(p.x,p.y);lctx.arc(p.x,p.y,cl,a-ca/2,a+ca/2);lctx.closePath();lctx.fillStyle=cg;lctx.fill();
  const ag=lctx.createRadialGradient(p.x,p.y,0,p.x,p.y,52);
  ag.addColorStop(0,'rgba(255,215,140,0.6)');ag.addColorStop(1,'rgba(0,0,0,0)');
  lctx.beginPath();lctx.arc(p.x,p.y,52,0,Math.PI*2);lctx.fillStyle=ag;lctx.fill();
  lctx.globalCompositeOperation='source-over';
  ctx.drawImage(lm,0,0);
}

function applySanityFX(){
  if(sanity<100){
    const vs=Math.max(0.12,(100-sanity)/100*0.75);
    const vg=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*0.28,canvas.width/2,canvas.height/2,canvas.height*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${vs})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  if(sanity<35){const ti=(35-sanity)/35*0.14;ctx.fillStyle=`rgba(90,0,0,${ti})`;ctx.fillRect(0,0,canvas.width,canvas.height);}

  const bx=pad,by=top+22,bw=82,bh=18;
  ctx.fillStyle=player.hiding?'rgba(0,170,70,0.8)':'rgba(170,20,20,0.65)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=player.hiding?'#88ffaa':'#ffaaaa';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(player.hiding?'■ HIDING':'● EXPOSED',bx+bw/2,by+12);
  // Stamina
  const sBy=top+50;ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('STAMINA',pad,sBy-1);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(pad-1,sBy-1,102,8);
  ctx.fillStyle=stam>50?LOC[locId].accent:stam>20?'#ffaa00':'#ff2200';ctx.fillRect(pad,sBy,100*(stam/maxStam),6);
  // Sanity
  const snBy=top+68;ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillText('SANITY',pad,snBy-1);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(pad-1,snBy-1,102,8);
  ctx.fillStyle=sanity>60?'#44cc88':sanity>30?'#ccaa00':'#cc1111';ctx.fillRect(pad,snBy,100*(sanity/100),6);
  // Noise
  const nBy=top+86;ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillText('NOISE',pad,nBy-1);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(pad-1,nBy-1,102,8);
  ctx.fillStyle=noiseLv<30?'#33aa55':noiseLv<70?'#aaaa00':'#ff2200';ctx.fillRect(pad,nBy,100*(noiseLv/100),6);
  // Objectives
  const ox=canvas.width-175,oy=top;const L=LOC[locId];
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(ox-8,oy-14,170,80);
  ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('OBJECTIVES',ox,oy);
  const ck=(done)=>done?'✓':'○';
  ctx.fillStyle=objPowerCell?'#44ff88':'#888';ctx.fillText(`${ck(objPowerCell)} ${L.powerName}`,ox,oy+18);
  for(let i=0;i<objCoresNeeded;i++){const done=i<objCoresFound;ctx.fillStyle=done?'#44ff88':'#888';ctx.fillText(`${ck(done)} ${L.itemName} ${i+1}`,ox,oy+34+i*16);}
  const exitReady=canExit();ctx.fillStyle=exitReady?'#ffee44':'#555';ctx.fillText(`${ck(exitReady)} EXIT`,ox,oy+34+objCoresNeeded*16+2);
  if(monDiff==='nightmare'&&ecount>1){ctx.fillStyle='rgba(200,50,50,0.7)';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('⚠ 2 HUNTERS',pad,top+112);}
  if(gt<12){ctx.fillStyle='rgba(255,255,255,0.32)';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('WASD/Arrows: Move  |  Shift: Sprint  |  E: Interact',canvas.width/2,canvas.height-20);}
}

function drawNotePopup(){
  if(!notePopup)return;
  const alpha=Math.min(1,notePopup.timer,notePopup.timer>1?1:notePopup.timer);
  const cx=canvas.width/2,cy=canvas.height*0.72,pw=Math.min(canvas.width-60,520),ph=90;
  ctx.globalAlpha=alpha*0.92;ctx.fillStyle='rgba(10,8,6,0.9)';ctx.fillRect(cx-pw/2,cy-ph/2,pw,ph);
  ctx.strokeStyle='rgba(200,170,100,0.55)';ctx.lineWidth=1;ctx.strokeRect(cx-pw/2,cy-ph/2,pw,ph);
  ctx.globalAlpha=alpha;ctx.fillStyle='rgba(200,170,100,0.9)';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText('— NOTE —',cx,cy-ph/2+16);
  ctx.fillStyle='rgba(220,210,190,0.88)';ctx.font='12px monospace';
  const words=notePopup.text.split(' '),lines=[],maxW=pw-30;let line='';
  for(const w of words){const test=line+(line?' ':'')+w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;}if(line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,cx,cy-10+i*18));
  ctx.globalAlpha=1;
}

// ── MENU RENDERING ────────────────────────────────────────
function renderMenu(){
  const cx=canvas.width/2,cy=canvas.height/2;
  ctx.fillStyle='#040204';ctx.fillRect(0,0,canvas.width,canvas.height);
  const vg=ctx.createRadialGradient(cx,cy,cy*0.1,cx,cy,cy*0.9);
  vg.addColorStop(0,'rgba(15,0,5,0.25)');vg.addColorStop(1,'rgba(0,0,0,0.8)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center';
  if(gs==='menu'){
    ctx.shadowColor='#aa0000';ctx.shadowBlur=38;ctx.fillStyle='#cc1111';
    ctx.font=`bold ${Math.min(70,canvas.width/8)}px 'Courier New',monospace`;ctx.fillText('REMNANT',cx,cy-70);ctx.shadowBlur=0;
    ctx.fillStyle='#442222';ctx.font='14px monospace';ctx.fillText('S U R V I V A L  H O R R O R',cx,cy-38);
    ctx.fillStyle='rgba(140,100,80,0.55)';ctx.font='12px monospace';ctx.fillText('Something is still inside. Find what you need. Get out.',cx,cy-10);
  }else if(gs==='locSelect'){
    ctx.fillStyle='#cc1111';ctx.font='bold 24px monospace';ctx.fillText('SELECT LOCATION',cx,cy-115);
    ctx.fillStyle='rgba(150,100,80,0.5)';ctx.font='12px monospace';ctx.fillText('Each location has unique atmosphere and lore',cx,cy-90);
  }else if(gs==='diffSelect'){
    const L=LOC[locId];ctx.fillStyle=L.accent;ctx.font='bold 13px monospace';ctx.fillText(L.name.toUpperCase(),cx,cy-118);
    ctx.fillStyle='rgba(200,180,160,0.55)';ctx.font='12px monospace';ctx.fillText(L.desc,cx,cy-98);
    ctx.fillStyle='#cc1111';ctx.font='bold 22px monospace';ctx.fillText('SELECT DIFFICULTY',cx,cy-72);
    ctx.fillStyle='rgba(150,100,80,0.5)';ctx.font='11px monospace';ctx.fillText('Affects: noise traps · items needed · map size',cx,cy-52);
  }else if(gs==='monsterSelect'){
    ctx.fillStyle='#cc1111';ctx.font='bold 22px monospace';ctx.fillText('MONSTER DIFFICULTY',cx,cy-145);
    ctx.fillStyle='rgba(150,100,80,0.5)';ctx.font='11px monospace';ctx.fillText('Affects: speed · awareness · count',cx,cy-125);
  }else if(gs==='paused'){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.shadowColor='#880000';ctx.shadowBlur=22;ctx.fillStyle='#cc1111';ctx.font='bold 40px monospace';ctx.fillText('PAUSED',cx,cy-75);ctx.shadowBlur=0;
  }else if(gs==='death'){
    ctx.fillStyle='rgba(70,0,0,0.5)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.shadowColor='#ff0000';ctx.shadowBlur=32;ctx.fillStyle='#ff1111';
    ctx.font=`bold ${Math.min(56,canvas.width/8)}px monospace`;ctx.fillText('YOU DIED',cx,cy-55);ctx.shadowBlur=0;
    ctx.fillStyle='rgba(200,90,70,0.6)';ctx.font='14px monospace';ctx.fillText('The Remnant claimed you.',cx,cy-18);
  }else if(gs==='win'){
    ctx.shadowColor='#00ff66';ctx.shadowBlur=32;ctx.fillStyle='#44ff88';
    ctx.font=`bold ${Math.min(50,canvas.width/9)}px monospace`;ctx.fillText('ESCAPED',cx,cy-55);ctx.shadowBlur=0;
    ctx.fillStyle='rgba(80,200,110,0.65)';ctx.font='14px monospace';ctx.fillText('You made it out. This time.',cx,cy-18);
  }
  const bs=getBtns();
  bs.forEach(b=>{
    const x=b.x-b.w/2,y=b.y-b.h/2;
    ctx.fillStyle='rgba(80,8,8,0.82)';ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,b.w,b.h,7);else ctx.rect(x,y,b.w,b.h);ctx.fill();
    ctx.strokeStyle='rgba(180,50,50,0.6)';ctx.lineWidth=1.5;ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,b.w,b.h,7);else ctx.rect(x,y,b.w,b.h);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(b.t,b.x,b.y+(b.sub?1:5));
    if(b.sub){ctx.fillStyle='rgba(200,180,160,0.55)';ctx.font='10px monospace';ctx.fillText(b.sub,b.x,b.y+15);}
  });
}

// ── MAIN RENDER ───────────────────────────────────────────
function render(t){
  if(!canvas.width||!canvas.height)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(gs==='menu'||gs==='locSelect'||gs==='diffSelect'||gs==='monsterSelect'||gs==='death'||gs==='win'){renderMenu();return;}
  updCam();
  // Chase shake
  for(const e of enemies)if(e.state==='chase'&&e.dist<lr*0.65)shk=Math.max(shk,3.5);
  // Sanity blur
  // blur removed for performance - vignette handled in applySanityFX
  ctx.fillStyle='#060404';ctx.fillRect(0,0,canvas.width,canvas.height);
  const sc=Math.max(0,Math.floor(camX/TS)-1),ec=Math.min(MC-1,Math.ceil((camX+canvas.width)/TS)+1);
  const sr=Math.max(0,Math.floor(camY/TS)-1),er=Math.min(MR-1,Math.ceil((camY+canvas.height)/TS)+1);
  // Floor pass
  for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){const sx=c*TS-camX,sy=r*TS-camY;if(map[r]?.[c]!==WALL)drawFloor(sx,sy,r,c);}
  // Decos
  for(const dc of decos)if(dc.r>=sr&&dc.r<=er&&dc.c>=sc&&dc.c<=ec){const sx=dc.c*TS-camX,sy=dc.r*TS-camY;drawDeco(sx,sy,dc);}
  // Walls + specials
  for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){
    const sx=c*TS-camX,sy=r*TS-camY,tile=map[r]?.[c];
    if(tile===WALL)drawWall(sx,sy,r,c);
    else if(tile===HIDE)drawHide(sx,sy);
    else if(tile===DOOR_U||tile===DOOR_L||tile===DOOR_X)drawDoor(sx,sy,r,c,getDS(r,c));
  }
  // Noise traps
  for(const tr of noiseTraps){const isr=tr.r,isc=tr.c;if(isr>=sr-1&&isr<=er+1&&isc>=sc-1&&isc<=ec+1){const sx=isc*TS-camX,sy=isr*TS-camY;drawTrap(sx,sy,tr);}}
  // Pickups
  for(const it of pickups){
    if(it.got)continue;const isr=Math.floor(it.wy/TS),isc=Math.floor(it.wx/TS);
    if(isr<sr-1||isr>er+1||isc<sc-1||isc>ec+1)continue;
    const sx=isc*TS-camX,sy=isr*TS-camY;
    if(it.type==='power')drawPower(sx,sy,t);
    else if(it.type==='core')drawCore(sx,sy,it,t);
    else if(it.type==='hp')drawHP(sx,sy,t);
  }
  // Notes
  for(const nt of notes){if(nt.got)continue;const isr=Math.floor(nt.wy/TS),isc=Math.floor(nt.wx/TS);if(isr<sr-1||isr>er+1||isc<sc-1||isc>ec+1)continue;drawNote(isc*TS-camX,isr*TS-camY);}
  // Enemies
  for(const e of enemies){
    const vr=monDiff==='nightmare'?lr*1.4:lr*2.8;
    if(e.dist>vr&&monDiff!=='practice'&&monDiff!=='easy')continue;
    const alpha=monDiff==='nightmare'?Math.max(0,Math.min(1,(lr*2.2-e.dist)/lr)):1;
    if(alpha>0)drawMonster(e,t,alpha);
  }
  // Hallucination ghost
  if(hallGhost){const p=ws(hallGhost.x,hallGhost.y);ctx.save();ctx.globalAlpha=0.22+Math.sin(t*2)*0.08;ctx.translate(p.x,p.y);const eyePos=[[-5,-22],[5,-22],[0,-29],[-3,-16],[3,-16]];ctx.shadowColor='#ffffff';ctx.shadowBlur=6;ctx.fillStyle='rgba(200,180,220,0.5)';for(const[ex,ey]of eyePos){ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.restore();}
  // Particles
  for(const p of parts){const ps=ws(p.x,p.y);ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(ps.x,ps.y,p.sz,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
  // Player
  drawPlayer(t);

  // Flashlight overlay
  applyFlashlight();
  // Sanity effects
  applySanityFX();
  // Damage flash
  if(sfl>0){ctx.fillStyle=`rgba(150,0,0,${sfl*0.35})`;ctx.fillRect(0,0,canvas.width,canvas.height);}
  // Low HP pulse
  if(php===1&&ecount>0){const p=Math.abs(Math.sin(gt*2.3))*0.12;ctx.fillStyle=`rgba(80,0,0,${p})`;ctx.fillRect(0,0,canvas.width,canvas.height);}
  // HUD (no blur)
  drawHUD();
  // Note popup
  drawNotePopup();
  // Pause
  if(gs==='paused'){ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,canvas.width,canvas.height);renderMenu();}
}

// ── GAME LOOP ─────────────────────────────────────────────
let lastT=performance.now();
function loop(ts){
  try{
    let dt=(ts-lastT)/1000;if(dt>0.2)dt=0.016;lastT=ts;
    if(canvas.width!==cont.clientWidth||canvas.height!==cont.clientHeight)resizeCanvas();
    update(dt);render(ts/1000);
  }catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resizeCanvas);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
gs='menu';
requestAnimationFrame(loop);
})();
</script>
